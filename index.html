<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devis BTP</title>
  <style>
  body {
    font-family: Arial, sans-serif;
    max-width: 700px;
    margin: 30px auto;
    padding: 0 16px;
    background: #f4f4f4;
    color: #222;
  }

  h1 {
    color: #b35900;
    border-bottom: 3px solid #b35900;
    padding-bottom: 8px;
  }

  label {
    display: block;
    margin-top: 10px;
    font-weight: bold;
  }

  input {
    width: 100%;
    padding: 8px;
    box-sizing: border-box;
  }

  button {
    margin-top: 12px;
    padding: 8px 14px;
    cursor: pointer;
  }

  #lignes {
    padding: 0;
  }

  #lignes li {
    list-style: none;
    background: white;
    padding: 10px;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #lignes button{
    margin-top: 0;
  }

  #erreur {
    color: red;
  }

  #ttc {
    font-size: 1.3em;
    font-weight: bold;
  }
</style>
</head>

<body>
  <h1>Devis BTP</h1>

  <label for="designation">Désignation</label>
<input id="designation">

<label for="quantite">Quantité</label>
<input id="quantite" type="number">

<label for="prix">Prix unitaire (FCFA)</label>
<input id="prix" type="number">
<button onclick="ajouter()">Ajouter la ligne</button>
<p id="erreur"></p>

<ul id="lignes"></ul>

<p id="ht"></p>
<p id="tva"></p>
<p id="ttc"></p>
  <script>

let devis = [
  { designation: "Ciment 50 kg", quantite: 12, prix: 5500 },
  { designation: "Sable (m3)", quantite: 2, prix: 15000 },
  { designation: "Main-d'œuvre (jour)", quantite: 3, prix: 8000 },
  { designation: "Gravier (m3)", quantite: 2, prix: 20000}
];
let sauvegarde = localStorage.getItem("devis");

if (sauvegarde !== null) {
  devis = JSON.parse(sauvegarde);
}

function sauvegarder() {
  localStorage.setItem("devis", JSON.stringify(devis));
}

function afficher() {
  let texte = "";
  let total = 0;

    for (let i = 0; i < devis.length; i++) {
    let ligne = devis[i];
    let montant = ligne.quantite * ligne.prix;
    texte = texte + "<li>" + ligne.designation + " : " + ligne.quantite
          + " × " + ligne.prix + " = " + montant + " FCFA <button onclick='supprimer(" + i + ")'>Supprimer</button></li>";
    total = total + montant;
  }

  document.getElementById("lignes").innerHTML = texte;
  let tva = Math.round(total * 19.25/100);
  let ttc = total + tva;

  document.getElementById("ht").textContent = "Total HT : " + total + " FCFA";
  document.getElementById("tva").textContent = "TVA (19,25 %) : " + tva + " FCFA";
  document.getElementById("ttc").textContent = "Total TTC : " + ttc + " FCFA";
}
function ajouter() {
  let designation = document.getElementById("designation").value;
  let quantite = Number(document.getElementById("quantite").value);
  let prix = Number(document.getElementById("prix").value);
  if (designation === "" || quantite <= 0 || prix <= 0) {
  document.getElementById("erreur").textContent = "Remplissez les 3 champs (quantité et prix supérieurs à 0).";
  return;
}
document.getElementById("erreur").textContent = "";

  devis.push({ designation: designation, quantite: quantite, prix: prix });
  sauvegarder();
  afficher();
  document.getElementById("designation").value = "";
  document.getElementById("quantite").value = "";
  document.getElementById("prix").value = "";
  document.getElementById("designation").focus();
}
    function supprimer(i) {
  devis.splice(i, 1);
  sauvegarder();
  afficher();
}
afficher();
  </script>
</body>
</html>
